<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>照片蓝眼长毛猫｜E1 外观预览</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #24313b; background: #f5f1e9; }
    body { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; } p { line-height: 1.5; }
    .note { color: #795324; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 14px; }
    figure { margin: 0; padding: 14px; border-radius: 14px; background: white; box-shadow: 0 2px 14px #25303b14; }
    figcaption { font-weight: 700; margin-bottom: 8px; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .checker { background-color: #fff; background-image: linear-gradient(45deg,#e9edf0 25%,transparent 25%),linear-gradient(-45deg,#e9edf0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9edf0 75%),linear-gradient(-45deg,transparent 75%,#e9edf0 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    .map { position: relative; overflow: hidden; height: 320px; border-radius: 14px; background: #a7bba2 url('../../../../public/maps/campus-v20.png') center 42% / 520px auto no-repeat; }
    .map canvas { position: absolute; left: 50%; top: 55%; transform: translate(-50%,-100%); width: 77px; height: 52px; }
  </style>
</head>
<body>
  <h1>照片蓝眼长毛猫 · E1 外观候选</h1>
  <p class="note">四方向为静态样张，站姿、侧面和背面依据照片补全。当前不含动画或游戏接入。</p>
  <section class="grid" id="views"></section>
  <h2>地图候选比例</h2>
  <p>以每格约 0.1 倍显示，仅用于检查辨识度；真实落地点和碰撞尚未确定。</p>
  <div class="map"><canvas id="map-cat" width="768" height="512"></canvas></div>
  <script>
    const image = new Image();
    image.src = './character-views-v2.png';
    image.onload = () => {
      // The generated contact sheet has a few stray pixels at cell boundaries.
      // These display crops keep the intended figure without changing the source PNG.
      const views = [
        ['正面 / down',0,0,735],
        ['朝左 / left',752,0,784],
        ['朝右 / right',35,512,733],
        ['背面 / up',800,512,736]
      ];
      for (const [label,x,y,w] of views) {
        const figure = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.textContent = label;
        const canvas = document.createElement('canvas');
        canvas.width = 768; canvas.height = 512; canvas.className = 'checker';
        canvas.getContext('2d').drawImage(image,x,y,w,512,(768-w)/2,0,w,512);
        figure.append(caption,canvas); document.querySelector('#views').append(figure);
      }
      document.querySelector('#map-cat').getContext('2d').drawImage(image,0,0,768,512,0,0,768,512);
    };
  </script>
</body>
</html>

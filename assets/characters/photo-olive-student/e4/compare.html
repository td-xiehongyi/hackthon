<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆框眼镜男生｜左右步态对照</title>
<style>*{box-sizing:border-box}body{font:16px/1.7 system-ui;background:#f4f3ee;color:#243b32;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:27px}a{color:#326a50}button,select{font:inherit;padding:6px 14px;margin:0 10px 10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{background:white;border-radius:12px;padding:12px;text-align:center}canvas{width:100%;image-rendering:pixelated;background:repeating-conic-gradient(#edf2eb 0 25%,#fff 0 50%) 0/20px 20px}#strip{display:block;width:100%;margin-top:20px}p{color:#586a60}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style>
<main><h1>左右走路：旧版与修订版</h1><p>两版以同一帧序同步播放。观察手臂是否前后摆动、两腿是否交替收起，以及循环连接处是否突跳。</p><button id="play">暂停</button><button id="step">下一帧</button><label>速度 <select id="speed"><option value="0.5">半速</option><option value="1" selected>原速</option></select></label> <span id="phase"></span><div class="grid" id="cards"></div><h2>修订版四帧展开</h2><p>上排朝左，下排朝右。十字代表摆放落点；线条不是角色素材的一部分。</p><canvas id="strip" width="1000" height="620"></canvas><p id="status">加载中…</p><a href="preview.html">进入完整动画与地图试走</a></main>
<script type="module">
const manifests=await Promise.all(['../e3/manifest.json','manifest.json'].map(u=>fetch(u).then(r=>r.json())));
const maps=await Promise.all(manifests.map(async(m,i)=>{const map=new Map();await Promise.all(m.sheets.map(async s=>{const img=new Image();img.src=(i?'':'../e3/')+s.url;await img.decode();map.set(s.id,img)}));return map}));
const items=[];
for(const facing of ['left','right'])for(const v of [0,1]){const card=document.createElement('article'),title=document.createElement('b'),c=document.createElement('canvas');title.textContent=(facing==='left'?'朝左':'朝右')+' · '+(v?'修订版':'旧版');c.width=240;c.height=330;card.append(title,c);document.querySelector('#cards').append(card);items.push({v,facing,c,clip:manifests[v].clips.find(k=>k.mode==='walk'&&k.action==='move'&&k.facing===facing)})}
function draw(ctx,f,imgs,x,y,scale){const r=f.rect;ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs.get(f.sheetId),r.x,r.y,r.width,r.height,x-f.anchor.x*scale,y-f.anchor.y*scale,r.width*scale,r.height*scale);ctx.strokeStyle='#db725b';ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke()}
let playing=true,elapsed=0,index=0,last=performance.now();
function render(){for(const e of items){const ctx=e.c.getContext('2d');ctx.clearRect(0,0,240,330);draw(ctx,e.clip.frames[index],maps[e.v],120,310,.95)}document.querySelector('#phase').textContent='第 '+(index+1)+' / 4 帧';window.compareFrame=index}
function tick(now){const dt=Math.min(100,now-last);last=now;if(playing){elapsed+=dt*Number(document.querySelector('#speed').value);while(elapsed>=150){elapsed-=150;index=(index+1)%4;}render()}requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};
document.querySelector('#step').onclick=()=>{playing=false;elapsed=0;index=(index+1)%4;document.querySelector('#play').textContent='播放';render()};
const ctx=document.querySelector('#strip').getContext('2d');for(const [row,facing]of ['left','right'].entries()){const clip=items.find(e=>e.v===1&&e.facing===facing).clip;for(let c=0;c<4;c++)draw(ctx,clip.frames[c],maps[1],125+c*250,300+row*310,.9)}
render();requestAnimationFrame(tick);document.querySelector('#status').textContent='已加载新旧左右四组动画。正背步行、骑行和待机状态沿用旧版。';window.comparisonReady=true;
</script></html>

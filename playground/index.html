<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Character Playground — 角色模块原型</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #22222c;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 32px 16px 60px;
    margin: 0;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .subtitle { color: #999; font-size: 13px; margin-top: -8px; }

  .panel {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: #2a2a36;
    border: 1px solid #3a3a48;
    border-radius: 10px;
    padding: 20px;
  }
  #stageCanvas {
    image-rendering: pixelated;
    background: #3d5a3d;
    border: 2px solid #4a4a5a;
    border-radius: 4px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #2a2a36;
    border: 1px solid #3a3a48;
    border-radius: 10px;
    padding: 20px;
    min-width: 240px;
  }
  .control-group { display: flex; flex-direction: column; gap: 8px; }
  .control-group label.group-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #3a3a48;
    color: #ddd;
    border: 1px solid #4a4a5a;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover { background: #454555; }
  button.active {
    background: #4a6fb5;
    border-color: #5a7fc5;
    color: #fff;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
  }
  .dpad button { width: 100%; height: 100%; padding: 0; font-size: 11px; }
  .dpad .empty { visibility: hidden; }

  .compass-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .compass-section h2 { font-size: 14px; color: #bbb; margin: 0; font-weight: 500; }
  .compass {
    display: grid;
    grid-template-columns: repeat(3, 84px);
    grid-template-rows: repeat(3, 84px);
    gap: 4px;
  }
  .compass-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #232330;
    border: 1px solid #3a3a48;
    border-radius: 4px;
    position: relative;
  }
  .compass-cell canvas { image-rendering: pixelated; width: 56px; height: 62px; }
  .compass-cell .dir-label {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 9px;
    color: #888;
  }
  .compass-cell.center { background: transparent; border: none; }

  footer {
    color: #666;
    font-size: 12px;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<body>
  <h1>Character Playground</h1>
  <div class="subtitle">校园探索项目 · 角色模块原型（独立测试用，未接入正式项目）</div>

  <div class="panel">
    <div class="stage">
      <canvas id="stageCanvas" width="200" height="220"></canvas>
      <div id="stageLabel" style="font-size: 12px; color: #999;">walk · down</div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="group-label">状态 State</label>
        <div class="btn-row" id="stateButtons"></div>
      </div>

      <div class="control-group">
        <label class="group-label">方向 Direction（8向素材，常用4向已标出）</label>
        <div class="dpad" id="dpad"></div>
      </div>

      <div class="control-group">
        <label class="group-label">播放</label>
        <div class="btn-row">
          <button id="playPauseBtn">暂停</button>
        </div>
      </div>
    </div>
  </div>

  <div class="compass-section">
    <h2>8方向总览（当前状态同步播放，用于检查镜像/朝向）</h2>
    <div class="compass" id="compass"></div>
  </div>

  <footer>
    这是角色模块的独立原型，用于验证 8 方向 × idle/walk/run 的动画数据是否正确、
    可播放。角色造型为占位素材，尚未确定最终技术栈或最终美术风格。
  </footer>

<script src="../assets/character-meta.js"></script>
<script src="character-player.js"></script>
<script>
(function () {
  const meta = window.CHARACTER_META;
  const sheetImage = new Image();
  sheetImage.src = '../assets/character-sheet.png';

  const DIRECTION_LABELS = {
    down: '下 (下方主视角)', down_right: '右下', right: '右 (侧面主视角)',
    up_right: '右上', up: '上 (背面主视角)', up_left: '左上',
    left: '左 (侧面主视角)', down_left: '左下',
  };
  const PRIMARY_DIRECTIONS = new Set(['down', 'right', 'up', 'left']); // the 4 most-used facings
  const STATE_LABELS = { idle: 'Idle 待机', walk: 'Walk 行走', run: 'Run 奔跑' };
  const COMPASS_LAYOUT = [
    'up_left', 'up', 'up_right',
    'left', null, 'right',
    'down_left', 'down', 'down_right',
  ];

  let mainPlayer = null;
  const compassPlayers = [];

  function buildStateButtons() {
    const wrap = document.getElementById('stateButtons');
    meta.states.forEach(state => {
      const btn = document.createElement('button');
      btn.textContent = STATE_LABELS[state] || state;
      btn.dataset.state = state;
      btn.onclick = () => selectState(state);
      wrap.appendChild(btn);
    });
  }

  function buildDpad() {
    const wrap = document.getElementById('dpad');
    const grid = ['up_left', 'up', 'up_right', 'left', null, 'right', 'down_left', 'down', 'down_right'];
    grid.forEach(dir => {
      if (dir === null) {
        const spacer = document.createElement('div');
        spacer.className = 'empty';
        wrap.appendChild(spacer);
        return;
      }
      const btn = document.createElement('button');
      btn.textContent = PRIMARY_DIRECTIONS.has(dir) ? dir.toUpperCase() : dir;
      btn.dataset.direction = dir;
      btn.title = DIRECTION_LABELS[dir] || dir;
      btn.onclick = () => selectDirection(dir);
      wrap.appendChild(btn);
    });
  }

  function buildCompass() {
    const wrap = document.getElementById('compass');
    COMPASS_LAYOUT.forEach(dir => {
      const cell = document.createElement('div');
      cell.className = 'compass-cell' + (dir === null ? ' center' : '');
      if (dir) {
        const canvas = document.createElement('canvas');
        canvas.width = meta.frameWidth * 4;
        canvas.height = meta.frameHeight * 4;
        cell.appendChild(canvas);
        const label = document.createElement('div');
        label.className = 'dir-label';
        label.textContent = dir;
        cell.appendChild(label);
        const player = createCharacterPlayer(canvas, meta, sheetImage);
        compassPlayers.push({ dir, player });
      }
      wrap.appendChild(cell);
    });
  }

  function updateActiveButtons() {
    document.querySelectorAll('#stateButtons button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.state === mainPlayer.getState());
    });
    document.querySelectorAll('#dpad button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.direction === mainPlayer.getDirection());
    });
    document.getElementById('stageLabel').textContent =
      `${mainPlayer.getState()} · ${mainPlayer.getDirection()}`;
  }

  function selectState(state) {
    mainPlayer.setState(state);
    compassPlayers.forEach(({ player }) => player.setState(state));
    updateActiveButtons();
  }

  function selectDirection(dir) {
    mainPlayer.setDirection(dir);
    updateActiveButtons();
  }

  buildStateButtons();
  buildDpad();
  buildCompass();

  sheetImage.onload = () => {
    const stageCanvas = document.getElementById('stageCanvas');
    mainPlayer = createCharacterPlayer(stageCanvas, meta, sheetImage);
    mainPlayer.setState('walk');
    mainPlayer.setDirection('down');
    mainPlayer.start();
    updateActiveButtons();

    compassPlayers.forEach(({ dir, player }) => {
      player.setDirection(dir);
      player.setState('walk');
      player.start();
    });

    const playPauseBtn = document.getElementById('playPauseBtn');
    let playing = true;
    playPauseBtn.onclick = () => {
      playing = !playing;
      playPauseBtn.textContent = playing ? '暂停' : '播放';
      if (playing) {
        mainPlayer.start();
        compassPlayers.forEach(({ player }) => player.start());
      } else {
        mainPlayer.stop();
        compassPlayers.forEach(({ player }) => player.stop());
      }
    };
  };
})();
</script>
</body>
</html>
